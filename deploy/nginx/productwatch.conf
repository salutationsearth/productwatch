# Nginx site config for WatcherMart / ProductWatch
# Domains:
#   productwatch.jacob-yu.com      -> web UI (uvicorn :8000)
#   mcp.productwatch.jacob-yu.com  -> MCP streamable-http (:8001/mcp)
#
# After copying:
#   sudo ln -s /etc/nginx/sites-available/productwatch.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d productwatch.jacob-yu.com -d mcp.productwatch.jacob-yu.com
#   sudo nginx -t && sudo systemctl reload nginx

upstream watchermart_web {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream watchermart_mcp {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name productwatch.jacob-yu.com;

    location / {
        proxy_pass http://watchermart_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 25m;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.productwatch.jacob-yu.com;

    # Longer timeouts — MCP streams can stay open
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://watchermart_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        # SSE / streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
