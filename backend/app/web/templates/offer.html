{% extends "base.html" %}
{% block content %}
<section class="section narrow">
  <div class="card">
    <p class="eyebrow">Member offer</p>
    <h1 class="page-title">{{ percent_off|int }}% off {{ product_name }}</h1>
    {% if redeemed %}
    <p class="badge">Marked redeemed — thanks for shopping WatcherMart</p>
    {% endif %}
    <p class="section-sub">{{ subject }}</p>
    <div class="offer-body">{{ body_html | safe }}</div>
    {% if not redeemed %}
    <a class="btn btn-primary" href="/t/convert/{{ token }}">Mark as redeemed</a>
    {% endif %}
  </div>
</section>
{% endblock %}
